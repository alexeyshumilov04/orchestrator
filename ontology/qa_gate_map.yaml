# QA/QC: блоки чеклиста → гейты → агенты → уровни severity (ДАННЫЕ).
# Источник пунктов: QAQC/QA_QC_чеклист.xlsx, лист «Чек-лист».
# Реализованные проверки: domain/qaqc/checks_table.csv + ontology/qa_checks/*.csv.
# Гейты и агенты — из config.yaml (gates:, checks.package_blocks).
# Файл читается agents/checks/base.py (реестр) и agents/checks/report.py (покрытие).

meta:
  purpose: Соответствие «блок чеклиста 01..13 → гейт → агент → уровни severity» и покрытие чеклиста. Данные,
    не код.
  checklist: ../QAQC/QA_QC_чеклист.xlsx
  sheet: Чек-лист
  header_row: 4
  first_data_row: 5
  total_items: 6065
  blocks_total: 13
  block_column: Обязательная область ГПН / блок
  id_column: ID проверки / пункта
  digitized_table: domain/qaqc/checks_table.csv
  checks_dir: ontology/qa_checks
  items_outside_blocks: 195
  note: 'items — факт чеклиста (число пунктов блока; живой источник — ontology/qa_checks/checklist_index.csv).
    «Реализовано», статус и причины НЕ дублируются здесь: их считает agents/checks/report.py по живому
    каталогу проверок (domain/qaqc + ontology/qa_checks) и пишет в qaqc_coverage.json. Единственный ручной
    статус — out_of_scope (вне области итерации).'
  generated: '2026-10-09'
severity_levels:
  critical: 0.9
  major: 0.75
  note: значимость >= critical → critical; >= major → major; иначе minor
gates:
  G-DATA:
    agent: AG_DATA_STEWARD
    stages:
    - 0
    blocks:
    - '01'
    - '02'
    - '03'
  G-FACIES:
    agent: AG_FACIES
    stages:
    - 6
    blocks:
    - '05'
    - '06'
  G-GRID:
    agent: AG_GRID_VOLUMETRICS
    stages:
    - 4
    - 5
    blocks:
    - '04'
  G-MAPS:
    agent: AG_GRID_VOLUMETRICS
    stages:
    - 10
    blocks:
    - '07'
    - 08
  G-PETRO:
    agent: AG_PETROPHYSICS
    stages:
    - 7
    blocks:
    - '07'
    - 08
    - '13'
  G-SAT:
    agent: AG_PVT_SCAL
    stages:
    - 8
    blocks:
    - 09
  G-STRUCT:
    agent: AG_STRUCTURAL
    stages:
    - 1
    - 2
    - 3
    blocks:
    - '04'
  G-VOL:
    agent: AG_GRID_VOLUMETRICS
    stages:
    - 9
    blocks:
    - '10'
blocks:
  '01':
    title: Контроль информации, необходимой для выполнения экспертизы
    items: 8
    gates:
    - G-DATA
    severity: from_weight
  '02':
