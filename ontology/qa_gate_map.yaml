    severity: from_weight
  '04':
    title: Контроль качества построения структурной модели
    items: 679
    gates:
    - G-STRUCT
    - G-GRID
    severity: from_weight
  '05':
    title: Контроль качества построения куба фаций
    items: 1481
    gates:
