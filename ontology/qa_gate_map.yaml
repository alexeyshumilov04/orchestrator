    items: 873
    gates:
    - G-PETRO
    severity: from_weight
  '14':
    title: 14. Сейсморазведочные работы и кросс-функциональные проверки с результатами интерпретации сейсморазведочных
      работ и сейсмогеологических моделей
    items: 0
    gates: []
    severity: from_weight
# --- F-19: проверки РЕЗУЛЬТАТА (гейт → id проверок) — ДАННЫЕ ------------------
# Гейт не может стать passed, если проверки результата не нашли свидетельства
# (тогда они помечаются unverified): «операция формально прошла, результата нет».
result_checks:
  G-FACIES:
  - facies.cube_exists
  - facies.cube_nonempty
  G-PETRO:
  - cube.poro_exists
  - cube.poro_nonempty
  - cube.perm_exists
  - cube.perm_nonempty
  G-VOL:
  - cube.metric_exists
  - cube.metric_nonempty
# Ключи свидетельств пробника (данные; читают agents/checks/builtin.py и report.py).
evidence_keys:
  grid_properties: "список имён свойств сетки (get_all_properties); формы — [имя], {properties: [...]},
    [{name: ...}]"
  property_stats: "статистика куба: count|n_cells|cells|non_null, nulls, classes|unique"
  blocked_wells: "число или список блокированных скважин (для сообщения о причине)"
