    severity: from_weight
  '06':
    title: Контроль качества построения куба литологии
    items: 528
    gates:
    - G-FACIES
    severity: from_weight
  '07':
    title: Контроль качества построения куба пористости
    items: 61
    gates:
    - G-PETRO
    - G-MAPS
    severity: from_weight
  08:
    title: Контроль качества построения куба проницаемости
    items: 69
    gates:
    - G-PETRO
    - G-MAPS
    severity: from_weight
  09:
    title: Контроль качества построения куба насыщения
    items: 737
    gates:
    - G-SAT
    severity: from_weight
  '10':
    title: Контроль качества подсчёта запасов
    items: 86
    gates:
    - G-VOL
    severity: from_weight
  '11':
