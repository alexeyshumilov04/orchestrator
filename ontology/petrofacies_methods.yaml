# ── 10. Проверки, которые модули отдают в QA/QC (id — ДАННЫЕ) ────────────────
checks:
  - id: "geomate.phi_perm_fit_source"
    needs: ["permeability_fit", "core_data_contract"]
    reports: ["литотип", "n_pairs", "r2", "slope", "intercept", "источник"]
  - id: "geomate.facies_aggregates"
    needs: ["facies_model"]
    reports: ["классов", "доли", "связность", "тел", "net_to_gross"]
  - id: "geomate.rules_are_data"
    needs: ["sources", "columns", "blank_handling"]
    reports: ["файлов онтологии", "ролей колонок", "бланков"]
  - id: "geomate.saturation_jfunction"
    needs: ["saturation.j_function", "saturation.fit"]
    reports: ["тип породы", "n точек", "A", "B", "r2", "источник", "knowledge_status"]
  - id: "geomate.saturation_end_points"
    needs: ["saturation.end_points"]
    reports: ["Sw_irr", "Sw_max", "n", "источник"]
