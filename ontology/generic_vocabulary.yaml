# ============================================================================
# ОНТОЛОГИЯ: ГЕНЕРИЧЕСКАЯ ЛЕКСИКА, которую аудит правила 1 НЕ считает доменом.
#
# Зачем (замечание заказчика: «кажется, ты просто перенёс YAML/JSON в онтологию,
# что по факту хардкод»): чёрный список домена собирается ИЗ ДАННЫХ поля — в том
# числе из ВСЕХ строковых значений проектного YAML. Туда попадают и значения, не
# называющие объект поля (единицы измерения): например `expect.PHIE.units: percent`.
# Тогда любой код, где встречается слово «percent» в ДРУГОМ смысле (флаг «%»
# в пороге QA/QC, ключ прогресса отчёта, имя статистики API тНава `percentile`),
# помечался как домен — это ложное срабатывание, а не нарушение.
#
# ПРАВИЛА ПОЛЬЗОВАНИЯ (запрещено «лакировать»):
#   1. сюда попадает ТОЛЬКО генерическая лексика (единицы измерения, стандартные
#      термины протокола/API), НИКОГДА — имена объектов поля (месторождения,
#      пласты, маркеры, кубы, кривые, скважины, пути, ветви);
#   2. каждая позиция обязана иметь `why` — обоснование, почему это не домен;
#   3. исключение действует только для значения, ПРИШЕДШЕГО из ключа-носителя
#      единиц (`*.units`/`*.unit`), а не для любого вхождения строки;
#   4. список читается тестами (тест печатает исключённое и неиспользованное —
#      «мёртвые» исключения видны, а не скрыты).
#
# Проверка: tests/test_verify_hardcode.py, tests/test_no_domain_in_code.py,
#           tests/test_ontology_generality.py
# ============================================================================
schema_version: 1
knowledge_base: KB_GENERIC_VOCABULARY

policy:
  scope: "единицы измерения и стандартные термины протокола/API — не объекты поля"
  provenance_required: true
  carrier_keys_for_units: ["units", "unit"]   # откуда пришло значение (п.3 правил)

# Единицы измерения: значения, которые могут стоять в `units` любой кривой любого
# поля. Исключаются из чёрного списка токенов ТОЛЬКО как значения ключей-носителей
# единиц (см. policy.carrier_keys_for_units).
generic_unit_values:
  - value: "percent"
    why: "единица измерения (доля в процентах); слово встречается и как флаг «%» порога, и как имя статистики API — объект поля не назван"
  - value: "fraction"
    why: "единица измерения (доля единицы); не имя объекта"
  - value: "v/v"
    why: "единица измерения объёмной доли; не имя объекта"
  - value: "д.ед."
    why: "единица измерения «доли единицы»; не имя объекта"
  - value: "mD"
    why: "единица проницаемости (миллидарси); не имя объекта"
  - value: "md"
    why: "единица проницаемости в нижнем регистре; не имя объекта"

# Исключения для проверки КОММЕНТАРИЕВ кода (значение → где и почему это не домен).
# Пусто по умолчанию: комментарии обязаны быть домен-нейтральными.
comment_exceptions: []

# Файлы-носители ПРАВИЛ, которые аудит общности обязан проверять на параметры
# объектов тестирования (перечень — ДАННЫЕ, а не литерал в инструменте).
audited_rule_files:
  - "petrophysics_rules.yaml"
  - "facies_methods.yaml"
  - "structural_geostat_rules.yaml"
  - "pvt_scal_rules.yaml"
  - "thresholds_rules.yaml"
  - "input_recognition_rules.yaml"
  - "object_binding_rules.yaml"
  - "ensemble_rules.yaml"
  - "ontology_extra_rules.yaml"
  - "geomate_reuse_rules.yaml"
  - "petrofacies_methods.yaml"
  - "qa_gate_map.yaml"

# ── ИСКЛЮЧЕНИЯ ИЗ СКАНА КОДА (класс → обоснование) ───────────────────────────
# Правило 1 запрещает доменные значения в РАНТАЙМ-коде. Скрипты-ПРОБЫ
# (`tools/probe_*.py`) — измерительные протоколы: имя объекта здесь является
# ПРЕДМЕТОМ измерения (как в тестах), они не входят в конвейер и запускаются вручную
# в одной сессии тНава. Официальный аудит по той же причине не сканирует `tests/`.
scan_exclusions:
  - glob: "tools/probe_*.py"
    class: "measurement_protocol"
    why: >-
      протокол пробы на живой лицензии: имена объектов — предмет измерения
      (аналог теста), не рантайм конвейера; проверка правила 1 для них — ручная.

# ── ДАННЫЕ ДОКАЗАТЕЛЬСТВА ОБЩНОСТИ (`core/generality_audit.generality_proof`) ──
# Имена полей-зондов живут В ДАННЫХ, а не в коде инструмента.
generality_probe:
  field_unknown: "ПОЛЕ_БЕЗ_ФАЙЛА_ДАННЫХ"
  field_new: "ПОЛЕ_ТОЛЬКО_ДАННЫЕ"
